# Default YOLO11n fine-tune settings for person detection.
# Used by scripts/train_yolo11.py — override via CLI or environment.

model: yolo11n.pt
data: configs/person_crowdhuman.yaml
epochs: 50
imgsz: 640
batch: 8
patience: 20
pretrained: true
optimizer: auto
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3
box: 7.5
cls: 0.5
dfl: 1.5
mosaic: 1.0
mixup: 0.0
copy_paste: 0.0
close_mosaic: 10
amp: true
cache: false
workers: 4
project: runs/detect
name: person_yolo11n
save: true
plots: true
verbose: true
